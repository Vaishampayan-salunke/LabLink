version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lablink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lablink_user
      POSTGRES_PASSWORD: lablink_secure_password_2026
      POSTGRES_DB: lablink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lablink_user -d lablink"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lablink-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://lablink_user:lablink_secure_password_2026@postgres:5432/lablink
      SECRET_KEY: lablink_super_secure_jwt_secret_key_change_in_production_2026_xyz
      DEMO_ADMIN_ENABLED: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-2.5-flash
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:5173"]'
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lablink-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
