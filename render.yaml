services:
  # Backend API Web Service
  - type: web
    name: lablink-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && cd backend && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: lablink-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_ADMIN_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # Frontend Static Site (SPA)
  - type: web
    name: lablink-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://lablink-backend.onrender.com/api/v1

databases:
  # Managed PostgreSQL Database on Render
  - name: lablink-postgres
    databaseName: lablink
    user: lablink_user
    plan: free
